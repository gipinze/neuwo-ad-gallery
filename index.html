<html lang="en">
<title>Ad Unit Gallery</title>
<meta charset="utf-8">

<style>
/* Layout: unit list on the left, a device stage on the right; the stage plays the lab recording frame by frame */
:root {
  --bg: #eef2f4; --panel: #ffffff; --ink: #13232e; --muted: #5a6b77; --line: #d6dee4;
  --accent: #0b7a75; --accent-soft: #dcefed; --live: #9a5b00; --live-soft: #fcefd6;
  --stage: #1b2830; --stage-ink: #e6eef2; --bezel: #0c1216; --chrome: #dfe5e9; --chrome-ink: #46555f;
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d151a; --panel: #142028; --ink: #e3ecf0; --muted: #9aadb8; --line: #263843;
  --accent: #4fc4bb; --accent-soft: #123532; --live: #f0b45a; --live-soft: #3a2a12;
  --stage: #070c0f; --stage-ink: #e6eef2; --bezel: #000; --chrome: #23323b; --chrome-ink: #b5c4cd; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d151a; --panel: #142028; --ink: #e3ecf0; --muted: #9aadb8; --line: #263843;
  --accent: #4fc4bb; --accent-soft: #123532; --live: #f0b45a; --live-soft: #3a2a12;
  --stage: #070c0f; --stage-ink: #e6eef2; --bezel: #000; --chrome: #23323b; --chrome-ink: #b5c4cd; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding-block: 18px 12px; max-width: 1400px; margin: 0 auto }
.top h1 { font: 700 24px var(--display); margin: 0 }
.top p { margin: 0; color: var(--muted); font-size: 14px; flex: 1 1 320px }
.filters { display: flex; flex-wrap: wrap; gap: 6px; max-width: 1400px; margin: 0 auto 12px }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; max-width: 1400px; margin: 0 auto; padding-bottom: 40px }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 140px); overflow-y: auto }
.list h2 { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 8px 4px }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: pointer }
.item:hover { background: var(--accent-soft) }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent) }
.item img { width: 44px; height: 44px; object-fit: cover; object-position: center top; border-radius: 6px; border: 1px solid var(--line); background: var(--bg) }
.item b { display: block; font-weight: 600; font-size: 14px; line-height: 1.25 }
.item span { font-size: 12px; color: var(--muted) }
.play-tag { font: 500 10px var(--mono); color: var(--accent) }
.viewer { min-width: 0; display: grid; gap: 14px; align-content: start; align-self: start }
.stage { background: var(--stage); border-radius: 14px; padding: 22px 16px; display: grid; justify-items: center; align-content: start; gap: 14px; color: var(--stage-ink) }
.device { position: relative; max-width: 100%; min-width: 0 }
.device.mobile { background: var(--bezel); border-radius: 38px; padding: 12px; width: min(330px, 100%) }
.device.mobile .screen { border-radius: 26px; overflow: hidden; aspect-ratio: var(--ar) }
.device.desktop { width: min(980px, 100%); border-radius: 10px; overflow: hidden; background: var(--chrome) }
.device.desktop .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; color: var(--chrome-ink); font: 12px var(--mono) }
.device.desktop .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--chrome-ink); opacity: .45 }
.device.desktop .bar span { margin-left: 10px; background: var(--panel); color: var(--muted); border-radius: 6px; padding: 2px 10px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.device.desktop .screen { aspect-ratio: var(--ar) }
.screen { background: #fff; position: relative }
.screen img, .screen video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; background: #000 }
.caption { min-height: 24px; font: 500 14px var(--body); text-align: center; max-width: 60ch }
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; width: min(560px, 100%) }
.controls button { background: transparent; border: 1px solid #ffffff44; border-radius: 999px; padding: 5px 14px; cursor: pointer; color: var(--stage-ink) }
.controls button:hover { border-color: var(--stage-ink) }
.controls input[type=range] { flex: 1 1 180px; accent-color: var(--accent) }
.controls .count { font: 12px var(--mono); opacity: .75; font-variant-numeric: tabular-nums }
.views { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
.views button { max-width: 100%; white-space: normal; background: transparent; border: 1px solid #ffffff33; color: var(--stage-ink); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer }
.views button[aria-pressed="true"] { background: var(--stage-ink); color: var(--stage) }
.info { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px }
.info h3 { font: 600 22px var(--display); margin: 0; text-wrap: balance }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 999px }
.pill.built { background: var(--accent-soft); color: var(--accent) }
.pill.live { background: var(--live-soft); color: var(--live) }
.patch { font: 12px var(--mono); color: var(--muted) }
.info p { margin: 0; max-width: 70ch }
.note { color: var(--muted); font-size: 13px }
select.pick { display: none }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .list { display: none }
  select.pick { display: block; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>
<header class="top">
  <h1>Ad unit gallery</h1>
  <p>Every Neuwo ad unit on a neutral demo news page in our lab, with demo creatives (Neuwo's own in the recordings, fictional brands in some screenshots). Press play to watch a unit behave as the reader scrolls and taps; units without a video show their screenshots.</p>
</header>
<div class="filters" role="group" aria-label="Filter by group" id="filters"></div>
<div class="app">
  <nav class="list" id="list" aria-label="Ad units"></nav>
  <main class="viewer">
    <label for="pick" class="note" style="display:none" id="pickLabel">Ad unit</label>
    <select class="pick" id="pick" aria-label="Ad unit"></select>
    <section class="stage" aria-label="Preview">
      <div class="views" id="views" role="group" aria-label="Views"></div>
      <div class="device" id="device"></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="controls" id="controls">
        <button type="button" id="prev" aria-label="Previous frame">‹</button>
        <button type="button" id="play">Play</button>
        <button type="button" id="next" aria-label="Next frame">›</button>
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Frame">
        <button type="button" id="speed" aria-label="Playback speed">1×</button>
        <span class="count" id="count"></span>
      </div>
    </section>
    <section class="info" id="info"></section>
  </main>
</div>

<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var byId = {}; D.units.forEach(function (u) { byId[u.id] = u; });
  var state = { group: "all", unit: null, view: 0, frame: 0, playing: false, timer: 0, speed: 1 };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function thumb(u) {
    if (u.films.length) { var f = u.films[0].frames; return f[Math.min(f.length - 1, Math.floor(f.length / 3))].f; }
    if ((u.videos || []).length && u.pics.length) return u.pics[0].f;
    return u.pics.length ? u.pics[0].f : "";
  }
  function views(u) {
    var v = [];
    (u.videos || []).forEach(function (f) { v.push({ kind: "video", label: (f.device === "mobile" ? "Phone" : "Desktop") + " video", video: f, device: f.device, w: f.w, h: f.h }); });
    u.films.forEach(function (f) { v.push({ kind: "film", label: (f.device === "mobile" ? "Phone" : "Desktop") + " recording", film: f, device: f.device, w: f.w, h: f.h }); });
    u.pics.forEach(function (p) { v.push({ kind: "pic", label: p.cap, pic: p, device: p.device }); });
    return v;
  }
  function renderFilters() {
    var html = '<button type="button" class="chip" data-g="all" aria-pressed="' + (state.group === "all") + '">All</button>';
    D.groups.forEach(function (g) { html += '<button type="button" class="chip" data-g="' + g.id + '" aria-pressed="' + (state.group === g.id) + '">' + esc(g.title) + '</button>'; });
    html += '<button type="button" class="chip" data-g="films" aria-pressed="' + (state.group === "films") + '">With recording</button>';
    $("filters").innerHTML = html;
  }
  function visible(u) { return state.group === "all" || (state.group === "films" ? (u.films.length > 0 || (u.videos || []).length > 0) : u.group === state.group); }
  function renderList() {
    var html = "", opts = "";
    D.groups.forEach(function (g) {
      var us = D.units.filter(function (u) { return u.group === g.id && visible(u); });
      if (!us.length) return;
      html += "<h2>" + esc(g.title) + "</h2>";
      us.forEach(function (u) {
        html += '<button type="button" class="item" data-u="' + u.id + '" aria-current="' + (state.unit && state.unit.id === u.id) + '"><img src="' + esc(thumb(u)) + '" alt="" loading="lazy"><div><b>' + esc(u.name) + "</b><span>" + ((u.films.length || (u.videos || []).length) ? '<span class="play-tag">▶ ' + ((u.videos || []).length ? "video" : "recording") + "</span> · " : "") + "patch " + esc(u.patches) + "</span></div></button>";
        opts += '<option value="' + u.id + '"' + (state.unit && state.unit.id === u.id ? " selected" : "") + ">" + esc(g.title + " · " + u.name) + "</option>";
      });
    });
    $("list").innerHTML = html; $("pick").innerHTML = opts;
  }
  function stop() { state.playing = false; clearTimeout(state.timer); $("play").textContent = "Play"; var vv = $("screenVid"); if (vv && !vv.paused) vv.pause(); }
  function vcap(v, t) { var c = ""; (v.video.captions || []).forEach(function (x) { if (x.t <= t + 0.05) c = x.text; }); return c; }
  function current() { return views(state.unit)[state.view]; }
  function captionAt(fr, i) { for (var k = i; k >= 0; k--) { if (fr[k].cap) return fr[k].cap; } return ""; }
  function showFrame() {
    var v = current();
    if (v.kind === "film") {
      var fr = v.film.frames, i = state.frame;
      $("screenImg").src = fr[i].f; $("screenImg").alt = state.unit.name + ", frame " + (i + 1);
      $("scrub").value = i; $("count").textContent = (i + 1) + " / " + fr.length;
      $("caption").textContent = captionAt(fr, i);
      [fr[i + 1], fr[i + 2]].forEach(function (n) { if (n) { var im = new Image(); im.src = n.f; } });
    }
  }
  function tick() {
    var fr = current().film.frames;
    if (state.frame >= fr.length - 1) { state.frame = 0; showFrame(); }
    else { state.frame++; showFrame(); }
    var gap = state.frame < fr.length - 1 ? (fr[state.frame + 1].ms - fr[state.frame].ms) : 1400;
    if (!(gap > 0)) gap = 350;
    if (fr[state.frame].cap) gap = Math.max(gap, 900);
    state.timer = setTimeout(tick, gap / state.speed);
  }
  function renderStage() {
    stop();
    var v = current(), dev = v.device, ar = v.kind === "film" ? (v.w + " / " + v.h) : "auto";
    if (v.kind === "video") ar = v.w + " / " + v.h;
    var screen = v.kind === "video"
      ? '<div class="screen" style="--ar:' + ar + '"><video id="screenVid" muted playsinline preload="auto" src="' + esc(v.video.src) + '"></video></div>'
      : '<div class="screen" style="--ar:' + ar + '"><img id="screenImg" alt=""></div>';
    $("device").className = "device " + dev;
    $("device").innerHTML = dev === "desktop" ? '<div class="bar"><i></i><i></i><i></i><span>Neuwo Demo News · demo site in the Neuwo lab</span></div>' + screen : screen;
    var vs = views(state.unit), html = "";
    if (vs.length > 1) vs.forEach(function (x, k) { html += '<button type="button" data-v="' + k + '" aria-pressed="' + (k === state.view) + '">' + esc(x.label) + "</button>"; });
    $("views").innerHTML = html;
    var isFilm = v.kind === "film";
    $("controls").hidden = !(isFilm || v.kind === "video");
    if (v.kind === "video") {
      var vid = $("screenVid"); vid.parentNode.style.aspectRatio = v.w + " / " + v.h; vid.playbackRate = state.speed;
      $("scrub").max = 1000; $("scrub").value = 0; $("caption").textContent = vcap(v, 0); $("count").textContent = "0.0 s";
      var DUR = function () { return isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (v.video.seconds || 1); };
      vid.addEventListener("timeupdate", function () { $("scrub").value = Math.round(1000 * Math.min(1, vid.currentTime / DUR())); $("count").textContent = vid.currentTime.toFixed(1) + " s"; $("caption").textContent = vcap(v, vid.currentTime); });
      vid.addEventListener("ended", function () { state.playing = false; $("play").textContent = "Play"; });
      return;
    }
    if (isFilm) {
      $("screenImg").parentNode.style.aspectRatio = v.w + " / " + v.h;
      $("screenImg").style.height = "";
      $("scrub").max = v.film.frames.length - 1; state.frame = 0; showFrame();
    } else {
      $("screenImg").parentNode.style.aspectRatio = "auto";
      $("screenImg").style.height = "auto"; $("screenImg").src = v.pic.f; $("screenImg").alt = v.pic.cap;
      $("caption").textContent = v.pic.cap;
    }
  }
  function renderInfo() {
    var u = state.unit, g = D.groups.filter(function (x) { return x.id === u.group; })[0];
    $("info").innerHTML = '<div class="meta"><span class="pill ' + (u.status === "live" ? "live" : "built") + '">' + (u.status === "live" ? "Live" : "Built, lab-proven") + '</span><span class="patch">patch ' + esc(u.patches) + "</span><span class=\"patch\">" + esc(g ? g.title : "") + "</span></div><h3>" + esc(u.name) + "</h3><p>" + esc(u.what) + '</p><p class="note">' + ((u.videos || []).length ? "Recorded in the lab at 60 fps. The ads are Neuwo demo creatives that name the unit. " : u.films.length ? "Recorded in the lab, played back frame by frame. " : "Screenshots use demo ads for fictional brands. ") + "Real campaigns come from the SSPs. New formats go live only with the publisher's agreement.</p>";
  }
  function select(id, keepHash) {
    var u = byId[id] || D.units[0];
    state.unit = u; state.view = 0;
    renderList(); renderStage(); renderInfo();
    if (!keepHash) { try { history.replaceState(null, "", "#" + u.id); } catch (e) { location.hash = u.id; } }
  }
  $("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-g]"); if (!b) return;
    state.group = b.getAttribute("data-g"); renderFilters(); renderList();
    var first = D.units.filter(visible)[0]; if (first && !visible(state.unit)) select(first.id);
  });
  $("list").addEventListener("click", function (e) { var b = e.target.closest("[data-u]"); if (b) select(b.getAttribute("data-u")); });
  $("pick").addEventListener("change", function () { select(this.value); });
  $("views").addEventListener("click", function (e) { var b = e.target.closest("[data-v]"); if (!b) return; state.view = +b.getAttribute("data-v"); renderStage(); });
  $("play").addEventListener("click", function () {
    var vv = $("screenVid");
    if (vv) { if (vv.paused) { if (vv.ended) vv.currentTime = 0; vv.playbackRate = state.speed; vv.play(); state.playing = true; $("play").textContent = "Pause"; } else { vv.pause(); state.playing = false; $("play").textContent = "Play"; } return; }
    if (state.playing) { stop(); return; }
    state.playing = true; $("play").textContent = "Pause"; state.timer = setTimeout(tick, 200 / state.speed);
  });
  $("prev").addEventListener("click", function () { var vv = $("screenVid"); if (vv) { vv.pause(); vv.currentTime = Math.max(0, vv.currentTime - 0.5); return; } stop(); var n = current().film.frames.length; state.frame = (state.frame - 1 + n) % n; showFrame(); });
  $("next").addEventListener("click", function () { var vv = $("screenVid"); if (vv) { vv.pause(); vv.currentTime = Math.min(isFinite(vv.duration) ? vv.duration : (current().video.seconds || 0), vv.currentTime + 0.5); return; } stop(); var n = current().film.frames.length; state.frame = (state.frame + 1) % n; showFrame(); });
  $("scrub").addEventListener("input", function () { var vv = $("screenVid"); if (vv) { var d = isFinite(vv.duration) && vv.duration > 0 ? vv.duration : (current().video.seconds || 1); vv.currentTime = d * this.value / 1000; return; } stop(); state.frame = +this.value; showFrame(); });
  $("speed").addEventListener("click", function () { state.speed = state.speed === 1 ? 0.5 : state.speed === 0.5 ? 2 : 1; this.textContent = (state.speed === 0.5 ? "½" : state.speed) + "×"; var vv = $("screenVid"); if (vv) vv.playbackRate = state.speed; });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input, select")) return;
    if (current().kind !== "film" && current().kind !== "video") return;
    if (e.key === " ") { e.preventDefault(); $("play").click(); }
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("prev").click();
  });
  window.addEventListener("hashchange", function () { var id = location.hash.slice(1); if (byId[id] && (!state.unit || state.unit.id !== id)) select(id, true); });
  renderFilters();
  var start = location.hash.slice(1);
  var firstFilm = D.units.filter(function (u) { return (u.videos || []).length || u.films.length; })[0];
  select(byId[start] ? start : (firstFilm || D.units[0]).id, !!byId[start]);
})();
</script>
